[accessibility]
ui_scale = 1.0

[shell]
telemetry_enabled = false
settings_show_advanced = true
show_location = true
clipboard_enabled = true

[shell.launcher]
pinned = []
sort_by_usage = true

[wallpaper]
enabled = false
directory = "/home/joshua/Pictures/Wallpapers"
fill_mode = "crop"
fill_color = "#000000"

[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[notification]
enable_daemon = true

[osd]
background_opacity = 1.0

[location]
address = "Mississauga"

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 4000

[idle.behavior.lock]
timeout = 660
action = "lock"
enabled = true

[calendar]
enabled = true

[control_center.calendar]
show_events_card = true

[weather]
enabled = true

[system.monitor]
cpu_usage_activity_threshold = 80
cpu_usage_critical_threshold = 90
cpu_temp_activity_threshold = 80
cpu_temp_critical_threshold = 90
ram_pct_activity_threshold = 80
ram_pct_critical_threshold = 90
swap_pct_activity_threshold = 80
swap_pct_critical_threshold = 90

[bar.main]
position = "top"
background_opacity = 0.93
radius = 12
margin_ends = 12
margin_edge = 6
padding = 2
widget_spacing = 6
reserve_space = true

start = ["tray", "active_window"]
center = ["workspaces"]
end = ["cpu-temp", "ram", "clock", "volume", "control-center", "session"]

[widget.tray]
hide_passive = false

[widget.active_window]
title_scroll = "on_hover"
max_length = 145

[widget.workspaces]
show_labels = true
labels_only_when_occupied = true
label_source = "id"

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"
show_glyph = true

[widget.ram]
type = "sysmon"
stat = "ram_used"
show_glyph = true

[widget.clock]
format = "{:%H:%M %a, %b %d}"
tooltip_format = "{:%H:%M %a, %b %d}"

[widget.volume]
device = "output"

[widget.control-center]
glyph = "noctalia"

[widget.session]
glyph = "shutdown"
