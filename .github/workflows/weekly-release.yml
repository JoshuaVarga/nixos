name: weekly-release

on:
  schedule:
    cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    name: Rebase develop onto main and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Check for diff
        id: diff
        run: |
          count=$(git rev-list --count origin/main..develop)
          echo "develop is $count commits ahead of main"
          if [ "$count" -eq 0 ]; then
            echo "No diff — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Rebase develop onto main
        if: steps.diff.outputs.skip != 'true'
        run: |
          if ! git rebase origin/main; then
            echo "::error::Rebase conflict between develop and main. Aborting."
            git rebase --abort
            exit 1
          fi

      - name: Push develop and main
        if: steps.diff.outputs.skip != 'true'
        run: |
          git push origin HEAD:develop
          git push origin HEAD:main
